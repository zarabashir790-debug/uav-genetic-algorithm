[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-ga"
version = "0.1.0"
description = "Multi-objective UAV strategy engine using a Genetic Algorithm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
